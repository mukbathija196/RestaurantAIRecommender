[project]
name = "zomato-ai"
version = "0.1.0"
requires-python = ">=3.9"
# Runtime deps (keep in sync with requirements.txt). Vercel installs from here.
dependencies = [
  "pandas>=2.2.0",
  "pyarrow>=16.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
  "google-generativeai>=0.8.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = ["datasets>=2.19.0", "tqdm>=4.66.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

