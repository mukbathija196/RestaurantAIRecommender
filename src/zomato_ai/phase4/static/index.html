<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zomato AI — Recommendations</title>
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --border: #2d3a4d;
      --text: #e7edf5;
      --muted: #8b9cb3;
      --accent: #3d9cf0;
      --accent-dim: #2563a8;
      --danger: #f87171;
      --ok: #4ade80;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .wrap { max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    form {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
      display: grid;
      gap: 1rem;
    }
    label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, select, textarea {
      width: 100%;
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    textarea { min-height: 2.5rem; resize: vertical; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 560px) { .row2 { grid-template-columns: 1fr; } }
    button {
      cursor: pointer;
      background: linear-gradient(180deg, var(--accent), var(--accent-dim));
      color: #fff;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .chip {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      border-radius: 999px;
      padding: 0.35rem 0.65rem;
      font-size: 0.83rem;
      line-height: 1.2;
      cursor: pointer;
    }
    .chip.active {
      border-color: var(--accent);
      background: rgba(61, 156, 240, 0.2);
      color: #dbeafe;
    }
    .toggle-chip {
      margin-top: 0.45rem;
      padding: 0.35rem 0.65rem;
      font-size: 0.83rem;
      border-radius: 999px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .meta {
      margin-top: 1.25rem;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--muted);
      font-family: ui-monospace, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .meta.err { border-color: #7f1d1d; color: var(--danger); }
    .cards { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
    }
    .card h2 { font-size: 1.05rem; margin: 0 0 0.35rem; color: var(--text); }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      background: var(--border);
      color: var(--muted);
      margin-right: 0.35rem;
    }
    .expl { margin-top: 0.6rem; font-size: 0.92rem; color: #cbd5e1; }
    .empty { color: var(--muted); font-style: italic; }
    footer { margin-top: 2rem; font-size: 0.75rem; color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Restaurant recommendations</h1>
    <p class="sub">Calls <code>POST /recommendations</code> on this server (same origin). Choose city/locality from data-backed dropdowns.</p>

    <form id="form" autocomplete="on">
      <div class="row2">
        <div>
          <label for="city">City</label>
          <select id="city" name="city" required></select>
        </div>
        <div>
          <label for="locality">Locality</label>
          <select id="locality" name="locality"></select>
        </div>
      </div>
      <div>
        <label for="budget_range">Budget range (for two)</label>
        <select id="budget_range" name="budget_range"></select>
      </div>
      <div class="row2">
        <div>
          <label for="min_rating">Min rating</label>
          <input id="min_rating" name="min_rating" type="number" min="0" max="5" step="0.1" value="4.0" />
        </div>
        <div>
          <label for="limit">Max results</label>
          <input id="limit" name="limit" type="number" min="1" max="50" value="8" />
        </div>
      </div>
      <div>
        <label>Cuisine preferences (multi-select)</label>
        <div id="cuisine_chips" class="chip-wrap"></div>
        <button id="toggle_cuisines" type="button" class="toggle-chip" style="display:none;">Show more</button>
      </div>
      <div>
        <label for="extra">Extra preferences (comma-separated, optional)</label>
        <textarea id="extra" name="extra" placeholder="family-friendly, quick service"></textarea>
      </div>
      <div class="row2">
        <div>
          <label for="location_match">Location match</label>
          <select id="location_match" name="location_match">
            <option value="contains">contains</option>
            <option value="exact" selected>exact</option>
          </select>
        </div>
      </div>
      <button type="submit" id="submit">Get recommendations</button>
    </form>

    <div id="status" class="meta" style="display:none;"></div>
    <div id="cards" class="cards"></div>

    <footer>
      <a href="/docs">OpenAPI docs</a> · <a href="/health">Health</a>
    </footer>
  </div>

  <script>
    var UI_OPTIONS = null;
    var selectedCuisines = new Set();
    var showAllCuisines = false;

    function splitList(s) {
      if (!s || !String(s).trim()) return [];
      return String(s).split(",").map(function (x) { return x.trim(); }).filter(Boolean);
    }

    function showStatus(el, text, isErr) {
      el.style.display = "block";
      el.textContent = text;
      el.className = "meta" + (isErr ? " err" : "");
    }

    function hideStatus(el) {
      el.style.display = "none";
      el.textContent = "";
      el.className = "meta";
    }

    function setSelectOptions(selectEl, values) {
      selectEl.innerHTML = "";
      values.forEach(function (v) {
        var opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        selectEl.appendChild(opt);
      });
    }

    function refreshLocalities() {
      var city = document.getElementById("city").value;
      var localities = (UI_OPTIONS && UI_OPTIONS.localities_by_city && UI_OPTIONS.localities_by_city[city]) || [];
      var localityEl = document.getElementById("locality");
      var withAny = ["Any locality"].concat(localities);
      setSelectOptions(localityEl, withAny);
      localityEl.value = "Any locality";
    }

    function renderCuisineChips() {
      var wrap = document.getElementById("cuisine_chips");
      var toggle = document.getElementById("toggle_cuisines");
      wrap.innerHTML = "";
      var cuisines = (UI_OPTIONS && UI_OPTIONS.cuisines) || [];
      var popular = (UI_OPTIONS && UI_OPTIONS.popular_cuisines) || [];
      var visible = showAllCuisines ? cuisines : (popular.length ? popular : cuisines.slice(0, 6));
      visible.forEach(function (c) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (selectedCuisines.has(c) ? " active" : "");
        b.textContent = c;
        b.addEventListener("click", function () {
          if (selectedCuisines.has(c)) selectedCuisines.delete(c);
          else selectedCuisines.add(c);
          renderCuisineChips();
        });
        wrap.appendChild(b);
      });

      if (cuisines.length > 6) {
        toggle.style.display = "inline-block";
        toggle.textContent = showAllCuisines ? "Show less" : "Show more";
      } else {
        toggle.style.display = "none";
      }
    }

    function applyBudgetRanges() {
      var rangeEl = document.getElementById("budget_range");
      var b = (UI_OPTIONS && UI_OPTIONS.budget_bands) || {};
      var ranges = [{ value: "", label: "Any budget" }].concat(Object.keys(b).map(function (name) {
        var x = b[name] || {};
        var lo = x.min != null ? Math.round(x.min) : null;
        var hi = x.max != null ? Math.round(x.max) : null;
        var label = hi == null ? String(lo) + "+" : String(lo) + "-" + String(hi);
        return { value: name, label: label };
      }));

      rangeEl.innerHTML = "";
      ranges.forEach(function (r, idx) {
        var opt = document.createElement("option");
        opt.value = r.value;
        opt.textContent = r.label;
        if (idx === 0) opt.selected = true;
        rangeEl.appendChild(opt);
      });
    }

    async function loadOptions() {
      var res = await fetch("/ui/options");
      if (!res.ok) throw new Error("Failed to load UI options: " + res.status);
      UI_OPTIONS = await res.json();

      var cities = UI_OPTIONS.cities || [];
      setSelectOptions(document.getElementById("city"), cities);
      refreshLocalities();
      renderCuisineChips();
      applyBudgetRanges();
    }

    document.getElementById("city").addEventListener("change", refreshLocalities);
    document.getElementById("toggle_cuisines").addEventListener("click", function () {
      showAllCuisines = !showAllCuisines;
      renderCuisineChips();
    });

    document.getElementById("form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var status = document.getElementById("status");
      var cards = document.getElementById("cards");
      var btn = document.getElementById("submit");
      hideStatus(status);
      cards.innerHTML = "";

      var bandName = document.getElementById("budget_range").value;
      var bands = (UI_OPTIONS && UI_OPTIONS.budget_bands) || {};
      var selectedBand = bands[bandName] || {};
      var body = {
        city: document.getElementById("city").value,
        locality: (document.getElementById("locality").value === "Any locality") ? "" : document.getElementById("locality").value,
        cuisines: Array.from(selectedCuisines),
        budget_min: selectedBand.min != null ? Number(selectedBand.min) : null,
        budget_max: selectedBand.max != null ? Number(selectedBand.max) : null,
        min_rating: parseFloat(document.getElementById("min_rating").value) || 0,
        extra_preferences: splitList(document.getElementById("extra").value),
        location_match: document.getElementById("location_match").value,
        limit: parseInt(document.getElementById("limit").value, 10) || 10
      };

      btn.disabled = true;
      showStatus(status, "Loading…", false);

      try {
        var res = await fetch("/recommendations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        var data = await res.json().catch(function () { return {}; });

        if (!res.ok) {
          var detail = data.detail != null ? JSON.stringify(data.detail) : res.statusText;
          showStatus(status, "Error " + res.status + ": " + detail, true);
          return;
        }

        var m = data.meta || {};
        var lines = [
          "request_id: " + (data.request_id || "—"),
          "llm_model: " + (m.llm_model || "—"),
          "prompt_version: " + (m.prompt_version || "—"),
          "candidate_count: " + (m.candidate_count != null ? m.candidate_count : "—"),
          "total_after_filters: " + (m.total_after_filters != null ? m.total_after_filters : "—"),
          "used_fallback: " + (m.used_fallback ? "yes" : "no"),
          "error: " + (m.error != null ? m.error : "null")
        ];
        showStatus(status, lines.join("\n"), !!m.error && m.error !== "no_candidates");

        var recs = data.recommendations || [];
        if (recs.length === 0) {
          cards.innerHTML = '<p class="empty">No recommendations (try different filters or check meta.error).</p>';
          return;
        }

        recs.forEach(function (r) {
          var div = document.createElement("div");
          div.className = "card";
          var title = (r.name || "Restaurant") + " ";
          var sub = [];
          if (r.location) sub.push(r.location);
          if (r.rating != null) sub.push("★ " + r.rating);
          if (r.estimated_cost) sub.push(r.estimated_cost);
          div.innerHTML =
            "<h2>" + escapeHtml(title.trim()) + "</h2>" +
            "<div>" +
            '<span class="badge">#' + escapeHtml(String(r.rank)) + "</span>" +
            '<span class="badge">' + escapeHtml(String(r.restaurant_id || "")) + "</span>" +
            "</div>" +
            (sub.length ? "<div style=\"margin-top:0.4rem;font-size:0.85rem;color:var(--muted)\">" + escapeHtml(sub.join(" · ")) + "</div>" : "") +
            (r.cuisine ? "<div style=\"margin-top:0.35rem;font-size:0.85rem\">" + escapeHtml(String(r.cuisine)) + "</div>" : "") +
            '<div class="expl">' + escapeHtml(r.explanation || "") + "</div>";
          cards.appendChild(div);
        });
      } catch (err) {
        showStatus(status, "Network error: " + (err && err.message ? err.message : String(err)), true);
      } finally {
        btn.disabled = false;
        if (status.textContent === "Loading…") hideStatus(status);
      }
    });

    function escapeHtml(s) {
      var d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    (async function init() {
      var status = document.getElementById("status");
      try {
        await loadOptions();
      } catch (err) {
        showStatus(status, "Failed to load form options: " + (err && err.message ? err.message : String(err)), true);
      }
    })();
  </script>
</body>
</html>
